<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nf-core/rnaseq in 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c1422">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a 3D map of ten stations on the left, a lab-notebook panel on the right.
   One visual world (deep-water navy), single theme by choice. */
:root{
  color-scheme: dark;
  --ink:#0c1422;        /* scene background */
  --panel:#121c2e;      /* notebook panel */
  --raise:#1a2640;      /* chips, code blocks */
  --line:#2a3854;
  --text:#e7edf6;
  --muted:#98a6bd;
  --pipe:#62d2c3;       /* pipeline stations 1-6 */
  --analysis:#b9a0ff;   /* analysis stations 7-10 */
  --g-arv:#ff7d6b;      /* Asthma + RV */
  --g-crv:#f3bd4f;      /* Control + RV */
  --g-cveh:#5fa8ff;     /* Control + vehicle */
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:15px/1.55 var(--body);
  display:grid;grid-template-columns:minmax(0,1fr) 430px;overflow:hidden}
#stage{position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
.hud{position:absolute;left:16px;right:16px;display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:var(--muted);pointer-events:none}
.hud.top{top:14px;justify-content:space-between}
.hud.bot{bottom:14px}
.brand{font:600 17px/1.2 var(--display);letter-spacing:.02em;color:var(--text)}
.brand small{font:400 12.5px var(--body);color:var(--muted);margin-left:8px;letter-spacing:0}
.key{display:flex;gap:14px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.badge{border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:rgba(12,20,34,.7)}

#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.railrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.raillabel{font:600 11px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);width:66px}
.chip{font:500 13px/1 var(--mono);color:var(--text);background:var(--raise);border:1px solid var(--line);
  border-radius:6px;min-width:30px;height:28px;padding:0 8px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-current="true"]{color:#0c1422;border-color:transparent}
.chip.p[aria-current="true"],.chip.m[aria-current="true"]{background:var(--pipe)}
.chip.a[aria-current="true"]{background:var(--analysis)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--text);outline-offset:2px}

#body{flex:1;overflow-y:auto;padding:20px 22px 8px;min-height:0}
.eyebrow{font:600 11.5px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;margin:0 0 8px}
.eyebrow.p{color:var(--pipe)} .eyebrow.a{color:var(--analysis)}
h1{font:600 27px/1.15 var(--display);margin:0 0 10px;text-wrap:balance}
h2{font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
p{margin:0 0 10px;max-width:62ch}
ul{margin:0 0 10px;padding-left:18px} li{margin:0 0 5px}
code{font:400 12.5px/1.5 var(--mono);background:var(--raise);border-radius:4px;padding:1px 5px}
pre{font:400 12px/1.55 var(--mono);background:var(--raise);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;margin:0 0 10px;overflow-x:auto;white-space:pre}
.io{display:grid;grid-template-columns:44px 1fr;gap:5px 10px;margin:0 0 4px;font-size:13.5px}
.io dt{color:var(--muted);font:600 11px/1.9 var(--display);letter-spacing:.08em;text-transform:uppercase}
.io dd{margin:0}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--muted);font-size:13.5px}
.seg{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.seg button{font:500 13px var(--body);color:var(--text);background:var(--raise);border:1px solid var(--line);
  border-radius:6px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--analysis);border-color:transparent;color:#0c1422}
.nav{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.nav button{flex:1;font:600 14px var(--body);border-radius:8px;padding:11px 12px;cursor:pointer;
  border:1px solid var(--line);background:var(--raise);color:var(--text)}
.nav button#next{background:var(--text);color:#0c1422;border-color:transparent}
.nav button:disabled{opacity:.4;cursor:default}
a{color:var(--pipe)}
@media (max-width:860px){
  body{grid-template-columns:1fr;grid-template-rows:42% 58%}
  #panel{border-left:0;border-top:1px solid var(--line)}
  .brand small,.hud.bot .hint{display:none}
  .raillabel{width:auto;margin-right:4px}
  #body{padding:16px 16px 6px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" role="img" aria-label="3D map of the RNA-seq workflow. Each step is described in the panel."></canvas>
  <div class="hud top">
    <div class="brand">nf-core/rnaseq in 3D<small>FASTQ to differential expression · Benjamin Garceau</small></div>
    <span class="badge">Simulated data, for illustration</span>
  </div>
  <div class="hud bot">
    <div class="key">
      <span><i style="background:var(--g-arv)"></i>Asthma + RV</span>
      <span><i style="background:var(--g-crv)"></i>Control + RV</span>
      <span><i style="background:var(--g-cveh)"></i>Control + vehicle</span>
    </div>
    <span class="hint">Drag to rotate · scroll to zoom · click a station</span>
  </div>
</div>
<aside id="panel">
  <nav class="rail" aria-label="Steps">
    <div class="railrow"><span class="raillabel">Pipeline</span><span id="rail-p" class="railrow"></span></div>
    <div class="railrow"><span class="raillabel">Analysis</span><span id="rail-a" class="railrow"></span></div>
  </nav>
  <div id="body" tabindex="0"></div>
  <div class="nav">
    <button id="prev" type="button">Back</button>
    <button id="next" type="button">Next</button>
  </div>
</aside>

<script>
"use strict";
/* ---------------------------------------------------------------- content */
const STEPS = [
{ k:"m", short:"Map", name:"The whole route", eyebrow:"Start here", html:`
<p>nf-core/rnaseq takes raw reads and a samplesheet and returns a gene-by-sample count matrix and a quality report. It runs no statistical test between groups. That part is yours.</p>
<p>The back row of stations (1 to 6) is what the pipeline does. The front row (7 to 10) is the analysis you run afterward in R.</p>
<h2>One command runs stations 1 to 6</h2>
<pre>nextflow run nf-core/rnaseq -r 3.27.0 \\
  -profile singularity \\
  --input samplesheet.csv \\
  --outdir results \\
  --fasta genome.fa \\
  --gtf genes.gtf \\
  --aligner star_salmon</pre>
<p>Nextflow reads the samplesheet, turns every step into cluster jobs, runs each tool in its own container, and caches finished work so <code>-resume</code> picks up where a failed run stopped.</p>
<h2>Running example</h2>
<p>Nine bronchial epithelial samples in three groups of three: asthma + rhinovirus, control + rhinovirus, control + vehicle. Every number drawn here is simulated to show the shape of each step.</p>`},

{ k:"p", short:"FASTQ", name:"Samplesheet and FASTQ", eyebrow:"Station 1 · input", html:`
<p>Each stack is one sample's FASTQ file: millions of short reads, four lines per read (ID, bases, a plus sign, one quality character per base).</p>
<dl class="io"><dt>In</dt><dd><code>*.fastq.gz</code>, <code>samplesheet.csv</code>, genome FASTA, GTF</dd>
<dt>Out</dt><dd>one merged FASTQ (or pair) per sample</dd></dl>
<h2>The samplesheet</h2>
<pre>sample,fastq_1,fastq_2,strandedness
ASTHMA_RV_1,SRR…_1.fastq.gz,SRR…_2.fastq.gz,auto
CONTROL_RV_1,SRR…_1.fastq.gz,SRR…_2.fastq.gz,auto
CONTROL_VEH_1,SRR…_1.fastq.gz,SRR…_2.fastq.gz,auto</pre>
<ul><li>Rows that share a <code>sample</code> name are treated as re-sequenced lanes and concatenated.</li>
<li>Leave <code>fastq_2</code> empty for single-end data.</li>
<li>Put the group in the sample name. It becomes your column metadata later.</li></ul>`},

{ k:"p", short:"Read QC", name:"Strandedness and read QC", eyebrow:"Station 2 · look before you cut", html:`
<p>The bars are mean base quality at each position in the read. Quality usually sags toward the 3′ end, as it does here.</p>
<dl class="io"><dt>Tools</dt><dd><code>fq</code> + Salmon (strandedness), FastQC</dd>
<dt>Out</dt><dd><code>fastqc/*.html</code>, inferred strandedness</dd></dl>
<p>With <code>strandedness</code> set to <code>auto</code>, the pipeline subsamples each file, pseudoaligns the subsample with Salmon, and works out whether the library is forward, reverse or unstranded. Counting later depends on this.</p>
<h2>What to check</h2>
<ul><li>Green is Phred 28 or above. A red tail gets trimmed at the next station.</li>
<li>Adapter content rising along the read means short inserts.</li>
<li>A GC curve with two humps suggests contamination or heavy rRNA.</li></ul>`},

{ k:"p", short:"Trim", name:"Trim and filter", eyebrow:"Station 3 · clean the reads", html:`
<p>Red ends are adapter sequence. Trim Galore! clips them off along with low-quality tails, and drops reads that end up too short.</p>
<dl class="io"><dt>Tools</dt><dd>Trim Galore! (default) or <code>--trimmer fastp</code></dd>
<dt>Out</dt><dd>trimmed FASTQ, trimming reports</dd></dl>
<h2>Optional filters</h2>
<ul><li><code>--with_umi</code> pulls molecular barcodes out of reads with UMI-tools.</li>
<li>BBSplit removes reads from a contaminating genome when you supply one.</li>
<li><code>--remove_ribo_rna</code> filters ribosomal RNA with SortMeRNA.</li></ul>
<h2>What to check</h2>
<p>The share of bases removed. A few percent is routine. A large loss in one sample is worth a look before you trust its counts.</p>`},

{ k:"p", short:"Align", name:"Align to the genome", eyebrow:"Station 4 · where did each read come from", html:`
<p>The grey bar is a stretch of genome and the raised blocks are exons. STAR places each read on it. Reads that span an exon junction are split in two, with the gap bridging the intron (yellow arcs).</p>
<dl class="io"><dt>Tools</dt><dd>STAR, SAMtools, Picard MarkDuplicates</dd>
<dt>Out</dt><dd>sorted, indexed <code>.bam</code>; bigWig coverage tracks</dd></dl>
<p>The pipeline builds the STAR index from your FASTA and GTF on the first run. Save it with <code>--save_reference</code> and later runs skip that step.</p>
<p>Duplicates are marked, not removed. In RNA-seq, highly expressed genes produce genuine duplicate reads.</p>
<h2>What to check</h2>
<p>The uniquely mapped rate per sample in the STAR section of the report, and that all samples look alike.</p>`},

{ k:"p", short:"Quantify", name:"Count reads per gene", eyebrow:"Station 5 · reads become numbers", html:`
<p>Each bar is one gene in one sample. Samples run left to right, genes front to back. This grid is the count matrix.</p>
<dl class="io"><dt>Tools</dt><dd>Salmon on STAR's transcriptome alignments, then tximport</dd>
<dt>Out</dt><dd><code>star_salmon/salmon.merged.gene_counts.tsv</code>, <code>…gene_tpm.tsv</code></dd></dl>
<p>Salmon assigns each read to a transcript and splits ambiguous reads between candidates by probability. tximport then sums transcripts into genes.</p>
<h2>Other routes</h2>
<ul><li><code>--aligner star_rsem</code> quantifies with RSEM.</li>
<li><code>--aligner hisat2</code> aligns only. It produces no counts.</li>
<li><code>--pseudo_aligner salmon</code> with <code>--skip_alignment</code> skips the genome and is much faster.</li></ul>
<p class="note">Bars of the same colour differ in height partly because some samples were sequenced deeper. Station 7 fixes that.</p>`},

{ k:"p", short:"Report", name:"Quality report", eyebrow:"Station 6 · the pipeline's last word", html:`
<p>One column per sample: uniquely mapped reads in colour, multi-mapped in grey, unmapped in dark. MultiQC gathers every tool's output into a single page like this.</p>
<dl class="io"><dt>Tools</dt><dd>RSeQC, Qualimap, dupRadar, Preseq, DESeq2 (QC plots), MultiQC</dd>
<dt>Out</dt><dd><code>multiqc/star_salmon/multiqc_report.html</code></dd></dl>
<h2>What to check</h2>
<ul><li>Mapping rate and assigned-read share are similar across samples.</li>
<li>The strandedness check passes for every sample.</li>
<li>Gene body coverage is even. A 3′ skew points to degraded RNA.</li>
<li>The built-in PCA and sample-distance heatmap group replicates together.</li></ul>
<p class="note">The ringed column is simulated with a low mapping rate to show what an outlier looks like. A sample like that deserves a decision before the analysis: investigate, re-run, or drop it and say so.</p>
<p>The pipeline ends here. Nothing so far has compared one group with another.</p>`},

{ k:"a", short:"Normalize", name:"Normalize the counts", eyebrow:"Station 7 · make samples comparable", html:`
<p>Same grid as station 5. Raw counts scale with how deeply each sample was sequenced, so bars within a group are uneven for reasons unrelated to biology.</p>
<div class="seg" role="group" aria-label="Count scale">
  <button type="button" data-act="norm0" aria-pressed="true">Raw counts</button>
  <button type="button" data-act="norm1" aria-pressed="false">Divide by size factors</button>
</div>
<p>DESeq2 estimates one size factor per sample (median of ratios) and divides it out. After that, most genes sit level across all nine samples and the few that still differ by group stand out.</p>
<pre>library(DESeq2)
counts  <- read.delim("salmon.merged.gene_counts.tsv",
                      row.names = 1)[, -1]
coldata <- data.frame(group = factor(rep(
  c("Asthma_RV","Control_RV","Control_VEH"), each = 3)))
dds <- DESeqDataSetFromMatrix(round(counts), coldata, ~ group)
dds <- dds[rowSums(counts(dds) >= 10) >= 3, ]
vsd <- vst(dds)   # for plots only</pre>
<p class="note">Test on raw counts and let DESeq2 normalize. TPM and VST values are for plotting. Salmon counts are fractional, hence <code>round()</code>; importing with tximport is the more exact route.</p>`},

{ k:"a", short:"PCA", name:"PCA: do samples group?", eyebrow:"Station 8 · the first real look", html:`
<p>Each sphere is a sample, placed by its whole expression profile squeezed onto three axes. Rotate it. PC3 is only visible in 3D.</p>
<pre>plotPCA(vsd, intgroup = "group")</pre>
<h2>How to read it</h2>
<ul><li>Replicates of a group should sit together.</li>
<li>PC1 is the largest source of variation. Here it separates virus from vehicle.</li>
<li>PC2 here separates asthma from control among infected samples.</li>
<li>A sample sitting inside the wrong group suggests a label swap. Groups splitting by donor or run date suggest a batch effect to add to the design.</li></ul>
<p class="note">If the biggest axis in your real data is something other than your experimental factor, find out what it is before testing.</p>`},

{ k:"a", short:"DE test", name:"Test each gene", eyebrow:"Station 9 · differential expression", html:`
<p>Each dot is a gene. Left to right is log2 fold change, height is statistical confidence, depth is average expression. One cloud, two classic plots:</p>
<div class="seg" role="group" aria-label="Camera">
  <button type="button" data-act="volcano">Volcano view</button>
  <button type="button" data-act="ma">MA view</button>
</div>
<pre>dds <- DESeq(dds)
res <- results(dds, alpha = 0.05,
  contrast = c("group","Control_RV","Control_VEH"))
res <- lfcShrink(dds, res = res, type = "ashr",
  contrast = c("group","Control_RV","Control_VEH"))</pre>
<ul><li>Pink is up, blue is down, at adjusted p below 0.05 and at least a twofold change. The faint walls mark the twofold cut-offs.</li>
<li>Low-expression genes (near side in MA view) swing widely in fold change without reaching significance. Shrinkage tames them.</li></ul>
<h2>Which comparisons this design supports</h2>
<ul><li><b>Control RV vs control vehicle</b>: the effect of infection.</li>
<li><b>Asthma RV vs control RV</b>: the effect of asthma during infection.</li></ul>
<p class="note">With no asthma + vehicle group you cannot estimate the interaction, so you cannot say whether asthma changes the response to virus as opposed to baseline expression.</p>`},

{ k:"a", short:"Heatmap", name:"Heatmap and meaning", eyebrow:"Station 10 · from a gene list to a result", html:`
<p>Rows are top genes, columns are samples, colour and height are z-scores of VST expression: red above the gene's mean, blue below.</p>
<pre>top <- head(order(res$padj), 30)
m   <- assay(vsd)[top, ]
pheatmap::pheatmap(m, scale = "row",
  annotation_col = coldata)</pre>
<h2>Then ask what the genes have in common</h2>
<ul><li>Over-representation or GSEA against GO and Reactome (<code>clusterProfiler</code>, <code>fgsea</code>).</li>
<li>Compare with the original paper: overlap of significant genes, and whether fold changes point the same way.</li></ul>
<p class="note">The top rows carry names of interferon-stimulated genes, the kind virus infection typically switches on. The values and the lettered genes are invented.</p>
<p>To run this whole analysis stage as a pipeline too, feed the count matrix to <a href="https://nf-co.re/differentialabundance">nf-core/differentialabundance</a>.</p>`}
];

/* ------------------------------------------------------------ small utils */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
const gauss=()=>{let u=0,v=0;while(!u)u=R();v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const css=(c,k)=>`rgb(${c[0]*k|0},${c[1]*k|0},${c[2]*k|0})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=x=>x*x*(3-2*x);
const C={ink:"#0c1422",pipe:"#62d2c3",ana:"#b9a0ff",text:"#e7edf6",muted:"#98a6bd",
  g:["#ff7d6b","#f3bd4f","#5fa8ff"],plat:"#1b2942",platA:"#221f45",grey:"#8a97ad",dark:"#3a4760",
  ok:"#5bd08c",warn:"#f3bd4f",bad:"#f0625a",up:"#ff6fa8",down:"#6f9bff",ns:"#56637c"};
const GROUP=s=>s<3?0:s<6?1:2;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------------------------------------------------------ scene data */
const POS=[[0,-15],[22,-15],[44,-15],[66,-15],[88,-15],[110,-15],[93,15],[66,15],[39,15],[12,15]];
const items=[];           // every drawable
const anim=[];            // per-frame updaters
let normGoal=0,normMix=0;

function station(i){
  const ox=POS[i][0],oz=POS[i][1];
  const o={
    box(x,y,z,w,h,d,col,a){const c=hex(col);const b={t:"box",st:i,c:[ox+x,y+h/2,oz+z],s:[w,h,d],a:a==null?1:a};
      o.paint(b,c);items.push(b);return b},
    paint(b,c){b.col=[css(c,1),css(c,.74),css(c,.56)]},
    line(a,b,col,w,al){const l={t:"ln",st:i,a:[ox+a[0],a[1],oz+a[2]],b:[ox+b[0],b[1],oz+b[2]],css:col,w:w||1,al:al==null?1:al};items.push(l);return l},
    text(x,y,z,s,opt){const q=Object.assign({t:"txt",st:i,c:[ox+x,y,oz+z],s,px:12,css:C.muted,align:"center"},opt||{});items.push(q);return q},
    quad(pts,col,al){items.push({t:"quad",st:i,pts:pts.map(p=>[ox+p[0],p[1],oz+p[2]]),css:col,al})},
    sph(x,y,z,r,col){items.push({t:"sph",st:i,c:[ox+x,y,oz+z],r,col:hex(col)})},
    pt(x,y,z,r,col){items.push({t:"pt",st:i,c:[ox+x,y,oz+z],r,css:col})}
  };
  return o;
}

/* ground: path, platforms, signs */
const PATH=[];(function(){
  for(let x=-10;x<=110;x+=4)PATH.push([x,-15]);
  for(let a=-80;a<=80;a+=10){const r=a*Math.PI/180;PATH.push([110+15*Math.cos(r),15*Math.sin(r)])}
  for(let x=110;x>=2;x-=4)PATH.push([x,15]);
  for(let k=0;k<PATH.length-1;k++){
    const split=k>=31+8; // roughly where the pipeline hands over to analysis
    items.push({t:"ln",L:0,a:[PATH[k][0],-.2,PATH[k][1]],b:[PATH[k+1][0],-.2,PATH[k+1][1]],css:split?C.ana:C.pipe,ww:.55,al:.5});
  }
})();
const flow=[];for(let k=0;k<26;k++){const p={t:"pt",L:0,c:[0,0,0],r:.32,css:"#dff7f3",u:k/26};flow.push(p);items.push(p)}
function pathAt(u){const f=u*(PATH.length-1),k=Math.min(PATH.length-2,f|0),t=f-k;
  return[PATH[k][0]+(PATH[k+1][0]-PATH[k][0])*t,PATH[k][1]+(PATH[k+1][1]-PATH[k][1])*t]}

POS.forEach((p,i)=>{
  const ana=i>=6,base=hex(ana?C.platA:C.plat),rim=hex(ana?C.ana:C.pipe),N=30,Rr=8.6,top=[];
  for(let k=0;k<N;k++){const a=k/N*6.2832,b=(k+1)/N*6.2832;
    const x1=p[0]+Rr*Math.cos(a),z1=p[1]+Rr*Math.sin(a),x2=p[0]+Rr*Math.cos(b),z2=p[1]+Rr*Math.sin(b);
    top.push([x1,0,z1]);
    items.push({t:"quad",L:0,pts:[[x1,0,z1],[x2,0,z2],[x2,-.7,z2],[x1,-.7,z1]],css:css(mix(base,rim,.55),.5+.4*Math.abs(Math.sin(a))),al:1});
  }
  items.push({t:"quad",L:0,pts:top,css:css(base,1),al:1,edge:css(rim,.9)});
  items.push({t:"txt",sign:true,st:i,c:[p[0],10.2,p[1]],s:(i+1)+"  "+STEPS[i+1].short,px:13,css:ana?C.ana:C.pipe,align:"center",bold:true});
});

  ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===1){if(moved>4)sway=false;goal.th-=dx*.0065;goal.ph=clamp(goal.ph-dy*.0055,.06,1.5);}
  else if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
    if(pinch)goal.r=clamp(goal.r*pinch/d,9,320);pinch=d;sway=false;}});

    POS.forEach((p,i)=>{const q=project(p[0],1.5,p[1]);if(!q)return;const rad=9*V.F/q[2],d=Math.hypot(q[0]-x,q[1]-y);

    }else if(it.t==="sph"){const q=d[3],rad=it.r*V.F/q[2];ctx.globalAlpha=1;
      const gr=ctx.createRadialGradient(q[0]-rad*.35,q[1]-rad*.4,rad*.1,q[0],q[1],rad);gr.addColorStop(0,css(mix(it.col,[255,255,255],.45),1));gr.addColorStop(1,css(it.col,.62));
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(q[0],q[1],rad,0,6.2832);ctx.fill();
    }else{const q=d[3];ctx.globalAlpha=1;ctx.font=`${it.bold?600:500} ${it.px}px "IBM Plex Sans",system-ui,sans-serif`;ctx.textAlign=it.align;ctx.textBaseline="middle";
      ctx.lineWidth=3.5;ctx.strokeStyle=C.ink;ctx.strokeText(it.s,q[0],q[1]);ctx.fillStyle=it.css;ctx.fillText(it.s,q[0],q[1]);}
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- panel */
const body=document.getElementById("body"),prev=document.getElementById("prev"),next=document.getElementById("next");
STEPS.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.className="chip "+s.k;b.textContent=i===0?"Map":i;
  b.title=s.name;b.setAttribute("aria-label",(i?"Station "+i+": ":"")+s.name);b.onclick=()=>go(i);
  document.getElementById(s.k==="a"?"rail-a":"rail-p").appendChild(b);s.chip=b;});
function renderPanel(){const s=STEPS[cur];
  body.innerHTML=`<p class="eyebrow ${s.k==="a"?"a":"p"}">${s.eyebrow}</p><h1>${s.name}</h1>${s.html}`;body.scrollTop=0;
  STEPS.forEach((q,i)=>q.chip.setAttribute("aria-current",i===cur?"true":"false"));
  prev.disabled=cur===0;next.disabled=cur===STEPS.length-1;
  next.textContent=cur===0?"Start at station 1":cur===STEPS.length-1?"End of the route":"Next: "+STEPS[cur+1].short;}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
body.addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="norm0"||a==="norm1"){normGoal=a==="norm1"?1:0;body.querySelectorAll('[data-act^="norm"]').forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));}
  if(a==="volcano"){sway=false;goal.th=0;goal.ph=1.5;goal.tg=[POS[8][0],4,POS[8][1]];}
  if(a==="ma"){sway=false;goal.th=-Math.PI/2;goal.ph=.07;goal.tg=[POS[8][0],2,POS[8][1]];}});
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("pre"))return;
  if(e.key==="ArrowRight")go(cur+1);else if(e.key==="ArrowLeft")go(cur-1);});

if("serviceWorker" in navigator&&location.protocol==="https:"||location.hostname==="localhost"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
resize();Object.assign(cam,frameFor(0));cam.tg=cam.tg.slice();go(0);
const start=()=>requestAnimationFrame(frame);
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,900))]):Promise.resolve()).then(start,start);
</script>
